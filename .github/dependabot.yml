version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Pinned to 2.x on purpose: the academicpages partials do not compile under
      # dart-sass (jekyll-sass-converter 3.x). See the Gemfile and AGENTS.md.
      - dependency-name: jekyll-sass-converter
        update-types: ["version-update:semver-major"]
    groups:
      jekyll:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
