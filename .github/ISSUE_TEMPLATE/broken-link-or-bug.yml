name: Broken link or site bug
description: Something on conexdat.github.io is wrong, missing, or broken.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL of the page where you saw the problem.
      placeholder: https://conexdat.github.io/en/people/
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [ES, EN, FR, All]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: What did you click or expect, and what happened instead? A screenshot helps.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device (optional)
      placeholder: Safari 18 on iPhone
