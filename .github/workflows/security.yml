name: Security

# Two audits, like the other CoNexDat repositories:
#  - bundler-audit: the locked gems (Gemfile.lock) against the Ruby advisory
#    database. Runs when the lockfile changes and weekly, so advisories
#    published after the last lock change still surface.
#  - zizmor: static analysis of the workflow files themselves (unpinned
#    actions, credential persistence, excessive permissions, template injection).
on:
  push:
    branches: [main]
    paths: ["Gemfile", "Gemfile.lock", ".github/workflows/**"]
  pull_request:
    paths: ["Gemfile", "Gemfile.lock", ".github/workflows/**"]
  schedule:
    - cron: "23 6 * * 1"  # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a  # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true  # bundler-audit is locked in Gemfile.lock (group :audit)

      - name: Audit locked gems
        run: bundle exec bundle-audit check --update

  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Lint workflows
        # Same version as the pre-commit hook; bump both together.
        run: uvx zizmor@1.30.1 --min-severity low .github/workflows/
