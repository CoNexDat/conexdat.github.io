name: Link check

# Weekly check of every link on the site, internal and external. Broken links
# are reported in a single open issue labeled "broken-link", which is updated
# each week and closed automatically once everything passes again.
on:
  schedule:
    - cron: "41 7 * * 1"  # Mondays 07:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # open, update or close the broken-link report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8  # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/_site
            '_site/**/*.html'
          output: lychee-report.md
          format: markdown
          fail: false
          jobSummary: true

      - name: Open, update or close the broken-link issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label broken-link --state open --json number --jq '.[0].number // empty')
          if [ "$EXIT_CODE" != "0" ]; then
            {
              echo "The weekly link check found broken links on https://conexdat.github.io."
              echo "Fix them in the source (see AGENTS.md: never link into cnet.fi.uba.ar;"
              echo "prefer the new home of a project or a Wayback Machine snapshot)."
              echo
              echo "Run: $RUN_URL"
              echo
              # GitHub caps issue bodies at 65,536 characters.
              if [ "$(wc -c < lychee-report.md)" -gt 60000 ]; then
                head -c 60000 lychee-report.md
                echo
                echo
                echo "_Report truncated; the full list is in the run's job summary._"
              else
                cat lychee-report.md
              fi
            } > issue-body.md
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file issue-body.md
              gh issue comment "$existing" --body "Still failing as of $(date -u +%F). Report updated: $RUN_URL"
            else
              gh issue create --title "Broken links on the website" --label broken-link --body-file issue-body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All links pass as of $(date -u +%F): $RUN_URL"
          fi
