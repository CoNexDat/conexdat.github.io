# Install once with `uvx pre-commit install`; hooks then run on every commit.
# Run everything by hand with `uvx pre-commit run --all-files`.
# Vendored theme files, prebuilt JS, PDFs and fonts are left untouched.
exclude: ^(_sass/vendor/|assets/js/(main\.min\.js|plugins/|vendor/|_main\.js)|assets/(fonts|webfonts|pdf|css)/|files/|_site/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Whitespace hooks only touch files this project owns; the academicpages
      # templates stay byte-for-byte upstream (a newline at the end of a Liquid
      # include can change the rendered HTML).
      - id: trailing-whitespace
        files: '^(\.github/|_data/|_pages/|_news/|_plugins/|_scripts/|_bibliography/|assets/js/publications\.js$|_sass/_conexdat\.scss$|_includes/(people-list|projects-list|publications-filter|research-area|theses-list|news|masthead)\.html$|_layouts/bib_entry\.html$|[^/]+$)'
        exclude: \.(md|bib)$|^(Gemfile\.lock|_data/ui-text\.yml)$  # ui-text.yml is upstream
      - id: end-of-file-fixer
        files: '^(\.github/|_data/|_pages/|_news/|_plugins/|_scripts/|_bibliography/|assets/js/publications\.js$|_sass/_conexdat\.scss$|_includes/(people-list|projects-list|publications-filter|research-area|theses-list|news|masthead)\.html$|_layouts/bib_entry\.html$|[^/]+$)'
        exclude: ^(Gemfile\.lock|LICENSE)$
      - id: check-yaml
      - id: check-json
        exclude: ^\.devcontainer/  # JSON with comments
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
